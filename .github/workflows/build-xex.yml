name: Build NOVA 360 XEX

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - "third_party/**"
      - ".github/workflows/build-xex.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout NOVA 360
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev curl xz-utils patch python3 cmake ninja-build git

      - name: Checkout xsdk
        uses: actions/checkout@v4
        with:
          repository: xenosworks/xsdk
          path: xsdk

      - name: Checkout imgui-xenon
        uses: actions/checkout@v4
        with:
          repository: xenosworks/imgui-xenon
          ref: xenon
          path: third_party/imgui-xenon

      - name: Build Xbox 360 cross-toolchain
        working-directory: xsdk
        env:
          PREFIX: ${{ runner.temp }}/xsdk-gcc
          WORK: ${{ runner.temp }}/xsdk-gcc-work
          JOBS: "2"
        run: |
          tools/toolchain/build.sh
          echo "$PREFIX/bin" >> "$GITHUB_PATH"

      - name: Build xsdk and its host tools
        working-directory: xsdk
        run: make -j2

      - name: Configure and build NOVA 360
        run: |
          cmake -S . -B build-nova -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/xsdk/cmake/xsdk.cmake" \
            -DXSDK_TOOLCHAIN="$RUNNER_TEMP/xsdk-gcc"
          cmake --build build-nova --verbose

      - name: Upload XEX artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-360-XEX
          path: build-nova/nova360.xex
          if-no-files-found: error
          retention-days: 14
